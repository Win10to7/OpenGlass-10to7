name: CI

on:
  push:
    branches:
      - legacy
  pull_request:
    branches:
      - legacy
  workflow_dispatch:
    inputs:
      package_artifacts:
        description: Build installer and symbol archives
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: verify
    # The projects pin PlatformToolset v145, so only the VS2026 image can build them.
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: x64
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.ci-cache\vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.ci-cache\vcpkg-binary-cache,readwrite

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read product version
        id: version
        run: |
          $rc = Get-Content -LiteralPath "OpenGlass\OpenGlass.rc" -Raw
          $match = [regex]::Match($rc, '(?m)^\s*PRODUCTVERSION\s+(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*$')
          if (-not $match.Success) {
              throw "Could not find PRODUCTVERSION in OpenGlass\OpenGlass.rc."
          }
          $version = ($match.Groups[1..4] | ForEach-Object { $_.Value }) -join '.'
          $artifactName = "v$version-unsigned"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          @"
          ## OpenGlass CI

          - Version: ``$version``
          - Artifact: ``$artifactName``
          - Signing: unsigned validation build
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Resolve vcpkg root
        run: |
          $candidates = @($env:VCPKG_INSTALLATION_ROOT, 'C:\vcpkg') | Where-Object { $_ }
          $root = $candidates | Where-Object {
              Test-Path -LiteralPath (Join-Path $_ 'scripts\buildsystems\msbuild\vcpkg.props')
          } | Select-Object -First 1
          if (-not $root) {
              throw "vcpkg MSBuild integration not found in: $($candidates -join ', ')"
          }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.nuget\packages
            ${{ github.workspace }}\packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/packages.config', 'Common/NuGet.props', 'Common/NuGet.targets') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Determine vcpkg cache identity
        id: vcpkg_cache_identity
        run: |
          $identity = "$env:ImageOS-$env:ImageVersion"
          if ($identity -notmatch '^[A-Za-z0-9._-]+$') {
              throw "Invalid runner image identity: $identity"
          }
          "value=$identity" >> $env:GITHUB_OUTPUT
      - name: Cache vcpkg binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.ci-cache\vcpkg-binary-cache
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg_cache_identity.outputs.value }}-v145-x64-windows-static-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg_cache_identity.outputs.value }}-v145-x64-windows-static-

      - name: Initialize cache directories
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Record toolchain versions
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $msbuildVersion = (msbuild -version -nologo | Select-Object -Last 1).Trim()
          $vcpkgVersion = (& "$env:VCPKG_ROOT\vcpkg.exe" version | Select-Object -First 1).Trim()
          @"

          ### Toolchain

          - Runner image: ``$env:ImageOS $env:ImageVersion``
          - MSBuild: ``$msbuildVersion``
          - vcpkg: ``$vcpkgVersion`` (``$env:VCPKG_ROOT``)
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Build solution
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path "MSBuild_Logs" | Out-Null
          # The projects import vcpkg through Common\CppProject.Configuration.props
          # (VcpkgEnableManifest/VcpkgManifestInstall default to true), but the hosted
          # runner has no user-wide vcpkg integration, so force the imports in.
          #
          # Do NOT pass /p:VcpkgTriplet here. vcpkg.targets runs the install in a child
          # MSBuild project with RemoveProperties=<every global property>, then re-supplies
          # VcpkgTriplet via Properties=. RemoveProperties wins, so a globally-set triplet
          # is stripped from the child and vcpkg is invoked with --triplet "" ("Invalid
          # triplet"). Left alone it derives x64-windows-static from Platform plus
          # VcpkgUseStatic=true in Common\CppProject.Configuration.props.
          msbuild OpenGlass.slnx /m /restore `
            /p:Configuration=$env:BUILD_CONFIGURATION `
            /p:Platform=$env:BUILD_PLATFORM `
            /p:RestorePackagesConfig=true `
            /p:ForceImportBeforeCppProps=$env:VCPKG_ROOT\scripts\buildsystems\msbuild\vcpkg.props `
            /p:ForceImportAfterCppTargets=$env:VCPKG_ROOT\scripts\buildsystems\msbuild\vcpkg.targets `
            /p:OpenGlassInstallerEnabled=false `
            /bl:MSBuild_Logs/ci.binlog

      - name: Verify build outputs
        run: |
          # A solution build resolves CppProjectBuildRoot to the repo root, so every
          # project lands in one flat Build\<platform>\<configuration> directory.
          $expected = @(
              "Build\x64\Release\OpenGlass.dll",
              "Build\x64\Release\OpenGlassHost.exe",
              "Build\x64\Release\OpenGlassGUI.exe",
              "Build\x64\Release\OpenGlassTest.exe"
          )
          foreach ($path in $expected) {
              $item = Get-Item -LiteralPath $path -ErrorAction Stop
              if ($item.Length -eq 0) {
                  throw "Build output is empty: $path"
              }
          }

      - name: Locate Inno Setup
        id: iscc
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_installer)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $iscc = Get-Command ISCC.exe -ErrorAction Stop
          python --version
          "iscc=$($iscc.Source)" >> $env:GITHUB_OUTPUT

      - name: Package unsigned installer and symbols
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_artifacts == true)
        env:
          OPENGLASS_ISCC: ${{ steps.packaging_tools.outputs.iscc }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $arguments = @(
              "Scripts\OpenGlass.Packaging.proj",
              "/m",
              "/p:Configuration=Release",
              "/p:Platform=x64",
              "/p:BuildDependencies=false",
              "/p:OpenGlassIsccTool=$env:OPENGLASS_ISCC"
          )
          & msbuild @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "Packaging failed with exit code $LASTEXITCODE."
          }
          if (-not $iscc) {
              throw "ISCC.exe was not found; cannot build the installer."
          }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Package unsigned installer
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_installer)
        env:
          OPENGLASS_ISCC: ${{ steps.iscc.outputs.path }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $buildRoot = "Build\x64\Release"
          $artifacts = @(
              "$buildRoot\OpenGlassSetup.exe",
              "$buildRoot\OpenGlassSymbols.zip"
          )
          foreach ($path in $unsigned) {
              $item = Get-Item -LiteralPath $path -ErrorAction Stop
              if ($item.Length -eq 0) {
                  throw "Package output is empty: $path"
              }
          }

          $obsoletePackages = @(
              "$buildRoot\OpenGlassSetup.Legacy.exe",
              "$buildRoot\OpenGlassSetup.MILComp.exe",
              "$buildRoot\OpenGlassSymbols.Legacy.zip",
              "$buildRoot\OpenGlassSymbols.MILComp.zip"
          )
          foreach ($path in $obsoletePackages) {
              if (Test-Path -LiteralPath $path) {
                  throw "Obsolete architecture-specific package was produced: $path"
              }
          }

          $stagedDlls = @(
              @{ Path = "Cache\Packaging\Release\signed\legacy\OpenGlass.dll"; Architecture = "Legacy" },
              @{ Path = "Cache\Packaging\Release\signed\milcomp\OpenGlass.dll"; Architecture = "MILComp" }
          )
          foreach ($stagedDll in $stagedDlls) {
              $description = (Get-Item -LiteralPath $stagedDll.Path -ErrorAction Stop).VersionInfo.FileDescription
              if ($description -notlike "*($($stagedDll.Architecture))") {
                  throw "Unexpected architecture in $($stagedDll.Path): $description"
              }
          }

          $zipPath = "$buildRoot\OpenGlassSymbols.zip"
          $expectedPdbs = @(
              "legacy/OpenGlass.pdb",
              "milcomp/OpenGlass.pdb",
              "OpenGlassGUI.pdb",
              "OpenGlassHost.pdb"
          ) | Sort-Object
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zipPath))
          try {
              $entries = @($archive.Entries)
              $actualNames = @($entries.FullName | Sort-Object)
              $differences = @(Compare-Object -ReferenceObject $expectedPdbs -DifferenceObject $actualNames)
              if ($differences.Count -ne 0 -or $entries.Count -ne $expectedPdbs.Count) {
                  throw "Unexpected contents in $zipPath`: $($actualNames -join ', ')"
              }
              foreach ($entry in $entries) {
                  if ($entry.Length -eq 0) {
                      throw "Symbol archive entry is empty: $zipPath/$($entry.FullName)"
                  }
              }
          }
          finally {
              $archive.Dispose()
          }

          $unsignedExecutables = @(
              "$buildRoot\legacy\OpenGlass.dll",
              "$buildRoot\milcomp\OpenGlass.dll",
              "$buildRoot\common\OpenGlassHost.exe",
              "$buildRoot\common\OpenGlassGUI.exe",
              "$buildRoot\OpenGlassSetup.exe"
          )
          foreach ($path in $unsignedExecutables) {
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
                  throw "Expected an unsigned file, but $path has signature status $($signature.Status)."
              }
          }

      - name: Verify source tree remains unchanged
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --exit-code

      - name: Upload unsigned package
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_installer)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            Build/x64/Release/OpenGlassSetup.exe
            Build/x64/Release/OpenGlassSymbols.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload MSBuild binary log on failure
        if: failure() && hashFiles('MSBuild_Logs/ci.binlog') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msbuild-binlog-${{ github.run_id }}
          path: MSBuild_Logs/ci.binlog
          if-no-files-found: ignore
          retention-days: 7
